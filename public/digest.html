<script type="module">import{initAccount}from'/ui.js?v=rc14';await initAccount();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const response=await fetch('/api/digest');if(response.status===401)location.href='/auth.html';const d=await response.json();const v=d.vendorWatch||{};document.querySelector('#digest').innerHTML=`<div class="digestHeader"><div><span class="meta">Generated ${new Date(d.generatedAt).toLocaleString()}</span><h2>${esc(d.company||'Your organization')}</h2></div><span class="providerBadge">Today</span></div><div class="stats statsPanel digestStats"><div><strong>${v.total||0}</strong><span>vendors watched</span></div><div><strong>${v.excludedCount||0}</strong><span>active exclusions</span></div><div><strong>${v.alertCount||0}</strong><span>vendor alerts</span></div><div><strong>${d.strongCount}</strong><span>strong bids</span></div><div><strong>${d.changedCount||0}</strong><span>changed pursuits</span></div></div>${v.total?`<div class="section"><h3>VENDOR EXCLUSION WATCH</h3>${v.alerts?.length?v.alerts.map(x=>`<div class="risk"><strong>${esc(x.legalName)}</strong>&nbsp; ${esc(String(x.status).toUpperCase())} — ${esc(x.reason)}</div>`).join(''):'<p class="meta">No unread vendor eligibility alerts.</p>'}<p class="meta">${v.excludedCount||0} active exclusion · ${v.possibleMatchCount||0} possible match · ${v.clearCount||0} clear/no exact match</p></div>`:''}<div class="section"><h3>TOP OPPORTUNITY MATCHES</h3>${d.topMatches.map(x=>`<div class="digestOpportunity"><div class="row"><div><strong>${esc(x.title)}</strong><div class="meta">${esc(x.solicitationNumber||'')}</div></div><div class="score">${x.score}</div></div>${x.reasons.map(r=>`<div class="good">${esc(r)}</div>`).join('')}${x.risks.map(r=>`<div class="risk">${esc(r)}</div>`).join('')}</div>`).join('')||'<p class="meta">No strong matches today.</p>'}</div><div class="section"><h3>DEADLINES</h3>${d.upcomingDeadlines.map(x=>`<div class="deadlineRow"><strong>${x.daysRemaining}d</strong><span>${esc(x.title)}</span><span class="meta">Score ${x.score}</span></div>`).join('')||'<p class="meta">No deadlines in the next 14 days.</p>'}</div><div class="disclaimer">Screening and ranking are decision-support tools. Verify identity, exclusion scope and solicitation requirements against official sources before acting.</div>`;</script></body></html>
